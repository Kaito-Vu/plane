# Build-only compose: produces the production images (see build.sh).
# To run on prod use docker-compose.run.yml.
services:
  web:
    image: plane-web:${TAG:-prod}
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
  admin:
    image: plane-admin:${TAG:-prod}
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
  space:
    image: plane-space:${TAG:-prod}
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
  live:
    image: plane-live:${TAG:-prod}
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
  api:
    image: plane-api:${TAG:-prod}
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
  proxy:
    image: plane-proxy:${TAG:-prod}
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
