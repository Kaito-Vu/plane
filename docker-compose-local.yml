services:
  plane-redis:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-mq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks:
      - dev_env
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    volumes:
      - uploads:/data
    env_file:
      - .env
    ports:
      - "8333:8333"
      - "9333:9333"

  plane-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/instances/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
    environment:
      STATIC_RATE_LIMIT: "100000"
    restart: unless-stopped
    networks:
      - dev_env
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
    environment:
      STATIC_RATE_LIMIT: "100000"
    restart: unless-stopped
    networks:
      - dev_env
    depends_on:
      - api

  space:
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
    environment:
      STATIC_RATE_LIMIT: "100000"
    restart: unless-stopped
    networks:
      - dev_env
    depends_on:
      - api

  live:
    
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://plane-redis:6379/
      PORT: "3000"
    depends_on:
      - api
      - plane-redis
    networks:
      - dev_env

  proxy:
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: unless-stopped
    networks:
      - dev_env
    ports:
      - "80:80"
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ":80"
    depends_on:
      web:
        condition: service_started
      admin:
        condition: service_started
      space:
        condition: service_started
      live:
        condition: service_started
      api:
        condition: service_healthy
      plane-seaweedfs:
        condition: service_started

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  dev_env:
    driver: bridge
