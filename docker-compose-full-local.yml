# Full local stack: infra + API + web/admin/space/live + proxy.
# Prereq: ./setup.sh  (creates root .env and apps/api/.env)
#
# Start:
#   docker compose --env-file .env -f docker-compose-full-local.yml up --build -d
#
# Open: http://localhost  (nginx proxy on port 80)
#   /            → web
#   /god-mode/   → admin
#   /spaces/     → space
#   /live/       → live
#   /api/        → api
#
# Stop the backend-only stack first if it is running:
#   docker compose -f docker-compose-local.yml down

x-frontend-build-args: &frontend-build-args
  DOCKER_BUILDKIT: 1
  # Empty base URLs → browser uses same origin (proxy on :80)
  VITE_API_BASE_URL: ""
  VITE_WEB_BASE_URL: ""
  VITE_ADMIN_BASE_URL: ""
  VITE_ADMIN_BASE_PATH: "/god-mode"
  VITE_SPACE_BASE_URL: ""
  VITE_SPACE_BASE_PATH: "/spaces"
  VITE_LIVE_BASE_URL: ""
  VITE_LIVE_BASE_PATH: "/live"

x-api-local-env: &api-local-env
  WEB_URL: ${WEB_URL:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
  APP_BASE_PATH: ${APP_BASE_PATH:-}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost}
  ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/god-mode}
  SPACE_BASE_URL: ${SPACE_BASE_URL:-http://localhost}
  SPACE_BASE_PATH: ${SPACE_BASE_PATH:-/spaces}
  LIVE_BASE_URL: ${LIVE_BASE_URL:-http://localhost}
  LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
  USE_MINIO: ${USE_MINIO:-1}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}

services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - full_local
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - full_local
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    networks:
      - full_local
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      silo server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - full_local
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      # Host 5433 avoids clash with other local Postgres (e.g. OpenProject on 5432)
      - "5433:5432"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - full_local
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *api-local-env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - full_local
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *api-local-env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - full_local
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *api-local-env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - full_local
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    environment:
      <<: *api-local-env
    depends_on:
      - plane-db
      - plane-redis

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    networks:
      - full_local
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    networks:
      - full_local
    depends_on:
      - api
      - web

  space:
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        <<: *frontend-build-args
    restart: unless-stopped
    networks:
      - full_local
    depends_on:
      - api
      - web

  live:
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - full_local
    environment:
      PORT: "3000"
      API_BASE_URL: http://api:8000
      WEB_BASE_URL: ${WEB_URL:-http://localhost}
      LIVE_BASE_URL: ${LIVE_BASE_URL:-http://localhost}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-secret-key}
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
    depends_on:
      - api
      - plane-redis
      - web

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - full_local
    ports:
      - "80:80"
    volumes:
      - ./apps/proxy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # nginx template envsubst (official image)
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      # FILE_SIZE_LIMIT is bytes in .env; nginx client_max_body_size uses MB here
      FILE_SIZE_LIMIT_MB: ${FILE_SIZE_LIMIT_MB:-50}
      NGINX_ENVSUBST_FILTER: "BUCKET_NAME|FILE_SIZE_LIMIT_MB"
    depends_on:
      - web
      - api
      - space
      - admin
      - live
      - plane-minio

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  full_local:
    driver: bridge
